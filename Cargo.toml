[package]
name = "hbbs"
version = "1.1.99-47"
authors = ["sctg <sctgdesk@k-cloud.pp.ua>", "rustdesk <info@rustdesk.com>"]
edition = "2021"
build = "build.rs"
default-run = "hbbs"

[[bin]]
name = "hbbr"
path = "src/hbbr.rs"

[[bin]]
name = "rustdesk-utils"
path = "src/utils.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
signal-hook = "0.3"
hbb_common = { path = "libs/hbb_common" }
serde_derive = "1.0"
serde = "1.0"
serde_json = "1.0"
lazy_static = "1.5"
clap = "2"
rust-ini = "0.18"
minreq = { version = "2.12", features = ["punycode"] }
machine-uid = "0.2"
mac_address = "1.1"
whoami = "1.5"
base64 = "0.22"
axum = { version = "0.5", features = ["headers"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "chrono",
    "json",
] }
async-trait = "0.1"
async-speed-limit = { git = "https://github.com/open-trade/async-speed-limit" }
uuid = { version = "1.0", features = ["v4"] }
bcrypt = "0.15"
chrono = "0.4"
once_cell = "1.8"
sodiumoxide = "0.2"
tokio-tungstenite = "0.24"
tungstenite = "0.24"
regex = "1.10"
flexi_logger = { version = "0.29", features = [
    "async",
    "dont_minimize_extra_stacks",
] }
ipnetwork = "0.20"
local-ip-address = "0.6"
dns-lookup = "2.0"
ping = "0.5"
num_cpus = "1.16"
flate2 = "1.0"

reqwest = { version = "0.12", default-features = false, features = ["json","rustls-tls"] }
openssl = { version = "0.10", features = ["vendored"], optional = true }
testcontainers = { version = "0.27", features = ["reusable-containers"], optional = true }
testcontainers-modules = { version = "0.15", features = ["postgres"], optional = true }

[dev-dependencies]
tempfile = "3"
testcontainers = { version = "0.27", features = ["reusable-containers"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }

[features]
coverage = []
vendored-openssl = ["openssl"]
integration-test = ["tempfile", "dep:testcontainers", "dep:testcontainers-modules"]

[dependencies.tempfile]
version = "3"
optional = true

[build-dependencies]
hbb_common = { path = "libs/hbb_common" }

[workspace]
members = ["libs/hbb_common"]
exclude = ["ui"]

#https://github.com/johnthagen/min-sized-rust
#https://doc.rust-lang.org/cargo/reference/profiles.html#default-profiles
[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
strip = true
#opt-level = 'z' # only have smaller size after strip # Default is 3, better performance
#rpath = true # Not needed
